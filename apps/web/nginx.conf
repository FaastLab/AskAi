server {
  listen 80;
  server_name _;
  # Allow PDF uploads up to 50 MB (matches the UploadModal cap).
  client_max_body_size 50m;

  # Serve the SPA — fall through to index.html so React Router URLs work.
  root /usr/share/nginx/html;
  index index.html;

  # /healthz + /readyz proxy to the API so external probes (NPM, k8s,
  # monitoring) get a real JSON liveness response, not the SPA's
  # index.html. The api's actual endpoints are /healthz and /readyz
  # (not /health) — kept here as `location ~ ^/(healthz|readyz)$`.
  location ~ ^/(healthz|readyz)$ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    access_log off;
  }

  location / {
    try_files $uri /index.html;
  }

  # Proxy /v1/* to the API container. SSE-friendly: buffering off so
  # tokens hit the browser as fast as FastAPI emits them. NOTE:
  # `chunked_transfer_encoding` defaults to `on` and we leave it that
  # way — SSE relies on HTTP/1.1 chunked encoding to stream.
  location /v1/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no;
    gzip off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Same proxy rule for the OpenAPI docs.
  location ~ ^/(docs|openapi.json|redoc) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # MCP OAuth discovery — return a proper 404 JSON instead of the SPA's
  # index.html, so MCP clients (mcp-remote, Claude Desktop, Inspector)
  # know we don't speak OAuth and fall back to the bearer header. Without
  # this they JSON.parse the React HTML and crash with
  # `Unexpected token '<'`. Per MCP spec a 404 from these endpoints means
  # "OAuth not supported — use the provided credentials".
  location ~ ^/\.well-known/oauth- {
    default_type application/json;
    return 404 '{"error":"oauth_not_supported","detail":"This MCP server uses a static bearer token; send the Authorization header directly."}';
  }

  # MCP Streamable HTTP transport — same SSE-friendly shape as /v1/.
  # The transport speaks JSON-RPC over HTTP with optional SSE streaming
  # for long-running tool calls, so the buffering / read-timeout rules
  # have to match the /v1/ block.
  location /mcp {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no;
    gzip off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
