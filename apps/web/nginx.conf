server {
  listen 80;
  server_name _;
  # Allow large PDF uploads (some standards/manuals exceed 50 MB). NPM in
  # front must allow at least this too (its Advanced tab: client_max_body_size).
  client_max_body_size 500m;

  # Serve the SPA — fall through to index.html so React Router URLs work.
  root /usr/share/nginx/html;
  index index.html;

  # /healthz + /readyz proxy to the API so external probes (NPM, k8s,
  # monitoring) get a real JSON liveness response, not the SPA's
  # index.html. The api's actual endpoints are /healthz and /readyz
  # (not /health) — kept here as `location ~ ^/(healthz|readyz)$`.
  location ~ ^/(healthz|readyz)$ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    access_log off;
  }

  location / {
    try_files $uri /index.html;
  }

  # Proxy /v1/* to the API container. SSE-friendly: buffering off so
  # tokens hit the browser as fast as FastAPI emits them. NOTE:
  # `chunked_transfer_encoding` defaults to `on` and we leave it that
  # way — SSE relies on HTTP/1.1 chunked encoding to stream.
  location /v1/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no;
    gzip off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }

  # Same proxy rule for the OpenAPI docs.
  location ~ ^/(docs|openapi.json|redoc) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }

  # Auth-discovery endpoints — return a proper 404 JSON instead of the
  # SPA's index.html. MCP clients (mcp-remote, Claude Desktop, Inspector)
  # probe these paths on every connect; per RFC 9728 / MCP spec a 404
  # means "no OAuth here, use the provided bearer". Without an explicit
  # rule these would fall through to the SPA, which returns
  # `<!doctype html>...` — clients then JSON.parse the React HTML and
  # crash with `Unexpected token '<'`.
  #
  # Covers: oauth-authorization-server, oauth-protected-resource,
  # openid-configuration, and anything else under .well-known we don't
  # serve.
  location ~ ^/\.well-known/ {
    default_type application/json;
    return 404 '{"error":"not_supported","detail":"This MCP server uses a static bearer token; send the Authorization header directly."}';
  }

  # MCP Streamable HTTP transport — same SSE-friendly shape as /v1/.
  #
  # Critical: we explicitly redirect `/mcp` (no trailing slash) to
  # `/mcp/` BEFORE proxying, because FastAPI's mount('/mcp', …) issues
  # its own 307 to `/mcp/` when the slash is missing — and that
  # FastAPI-generated Location header uses the upstream scheme (http,
  # because nginx talks to api:8000 over plain HTTP), so clients get
  # redirected from https://askai.faastlab.ai/mcp to
  # http://askai.faastlab.ai/mcp/ and downgrade to the SPA. The 308 we
  # issue from here preserves the request method (POST stays POST) and
  # uses an absolute https URL so the protocol stays correct.
  location = /mcp {
    return 308 https://$host/mcp/;
  }
  location /mcp/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;   # so FastAPI builds https URLs
    proxy_set_header Connection "";
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_cache off;
    add_header X-Accel-Buffering no;
    gzip off;
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
  }
}
