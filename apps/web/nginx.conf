server {
  listen 80;
  server_name _;

  # Serve the SPA — fall through to index.html so React Router URLs work.
  root /usr/share/nginx/html;
  index index.html;

  location / {
    try_files $uri /index.html;
  }

  # Proxy /v1/* to the API container. SSE-friendly: turn off buffering
  # and bump the read timeout so long ask-streams don't get cut.
  location /v1/ {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_buffering off;
    proxy_read_timeout 300s;
  }

  # Same proxy rule for the OpenAPI docs.
  location ~ ^/(docs|openapi.json|redoc) {
    proxy_pass http://api:8000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
  }
}
