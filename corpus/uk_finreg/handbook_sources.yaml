# Bulk regulator-handbook ingest list — read by `make ingest-handbooks`.
#
# Two entry types:
#   - type: pdf            → direct PDF/DOCX/HTML URL fetched once
#   - type: govuk_manual   → recurses gov.uk's content API to grab every
#                            chapter of a multi-part manual (HMRC manuals).
#
# All URLs in this file were verified HTTP 200 with correct body type
# (%PDF- magic bytes for PDFs, ≥2KB HTML for hubs) on 2026-05-16.
#
# **FCA Handbook canonical PDFs live at api-handbook.fca.org.uk**, NOT
# at www.handbook.fca.org.uk (the latter serves soft-404 HTML for PDF
# paths). The ingester also has a runtime soft-404 detector for extra
# safety.
#
# License: Crown Copyright / Open Government Licence v3.0. Both licences
# allow redistribution + use with attribution; the ingester records the
# source URL on every document so attribution flows through to citations.

ingests:

