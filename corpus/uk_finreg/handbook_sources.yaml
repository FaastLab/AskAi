# Bulk regulator-handbook ingest list — read by `make ingest-handbooks`.
#
# Two entry types:
#   - type: pdf            → direct PDF/DOCX/HTML URL fetched once
#   - type: govuk_manual   → recurses gov.uk's content API to grab every
#                            chapter of a multi-part manual (HMRC manuals,
#                            ICO guidance hubs, TPR codes). Returns rich
#                            structured HTML — perfect for chunking.
#
# ALL URLS HERE ARE EDITABLE. Some are best-guesses at time of writing;
# if any 404s, fix that line and re-run. The ingester treats individual
# URL failures as warnings, not errors — partial corpora are useful.
#
# License: documents are Crown Copyright / OGL v3.0. Their licences allow
# redistribution + use with attribution; the ingester records the source
# URL on every document so attribution flows through to citations.

ingests:

  # ============================================================
  # FCA — Handbook + key guidance
  # ============================================================

  - name: "FCA — Consumer Duty (FG22/5)"
    type: pdf
    regulator: fca
    doc_type: fca
    url: "https://www.fca.org.uk/publication/finalised-guidance/fg22-5.pdf"
    effective_date: "2023-07-31"

  - name: "FCA — PS22/10 Strengthening Financial Promotion Rules"
    type: pdf
    regulator: fca
    doc_type: fca
    url: "https://www.fca.org.uk/publication/policy/ps22-10.pdf"
