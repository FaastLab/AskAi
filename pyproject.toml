[project]
name = "faastlab-askai"
version = "0.1.0"
description = "Open knowledge platform for humans and AI agents"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "FaastLab.Ai" }]
requires-python = ">=3.12,<3.13"

# Workspace root has no runtime deps of its own — every package declares its own.
dependencies = []

[dependency-groups]
dev = [
  "ruff>=0.7",
  "mypy>=1.13",
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-cov>=5.0",
  "httpx>=0.27",
  "types-redis",
]

[tool.uv.workspace]
members = [
  "packages/core",
  "packages/indexing",
  "packages/search",
  "packages/summarisation",
  "packages/askai",
  "packages/api",
  "packages/mcp",
  "packages/sdk",
  "packages/validators",
]

[tool.uv.sources]
faastlab-askai-core = { workspace = true }
faastlab-askai-indexing = { workspace = true }
faastlab-askai-search = { workspace = true }
faastlab-askai-summarisation = { workspace = true }
faastlab-askai-askai = { workspace = true }
faastlab-askai-api = { workspace = true }
faastlab-askai-mcp = { workspace = true }
faastlab-askai-sdk = { workspace = true }
faastlab-askai-validators = { workspace = true }

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["packages/*/src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]  # line length handled by formatter

[tool.ruff.format]
quote-style = "double"

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
mypy_path = "packages/core/src:packages/indexing/src:packages/search/src:packages/summarisation/src:packages/askai/src:packages/api/src:packages/mcp/src:packages/sdk/src:packages/validators/src"
explicit_package_bases = true
namespace_packages = true

[[tool.mypy.overrides]]
module = ["alembic.*", "celery.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests", "packages"]
python_files = "test_*.py"
addopts = "-ra --strict-markers"

[tool.coverage.run]
source = ["packages"]
omit = ["*/tests/*", "*/alembic/*"]

[tool.coverage.report]
fail_under = 70
show_missing = true
