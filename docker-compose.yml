services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: askai-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-askai}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-askai}
      POSTGRES_DB: ${POSTGRES_DB:-askai}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-askai} -d ${POSTGRES_DB:-askai}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: askai-redis
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis-data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: askai-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  minio-init:
    image: minio/mc:latest
    container_name: askai-minio-init
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin} &&
      mc mb -p local/${MINIO_BUCKET:-askai} || true &&
      exit 0
      "

  # ---- Application services (build from local Dockerfile) ----
  # Behind the 'app' profile so the default `make up` only starts infra
  # for local dev. Use `make up-app` (or `docker compose --profile app up -d`)
  # when you want the API + worker + web running in the background as
  # restartable containers — the right mode for an always-on demo VM.

  api:
    build:
      context: .
      dockerfile: Dockerfile
    image: faastlab/askai:local
    container_name: askai-api
    profiles: ["app"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql+asyncpg://askai:askai@postgres:5432/askai}
      REDIS_URL: ${REDIS_URL_INTERNAL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_INTERNAL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_INTERNAL:-redis://redis:6379/2}
      MINIO_ENDPOINT: http://minio:9000
    # ports:  # closed — internal only, accessed via NPM through askai-web
    #   - "${API_PORT:-8000}:8000"
    command:
      - uvicorn
      - faastlab_askai_api.main:app
      - --host=0.0.0.0
      - --port=8000
    restart: unless-stopped

  worker:
    image: faastlab/askai:local
    container_name: askai-worker
    profiles: ["app"]
    depends_on:
      api:
        condition: service_started
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql+asyncpg://askai:askai@postgres:5432/askai}
      REDIS_URL: ${REDIS_URL_INTERNAL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_INTERNAL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_INTERNAL:-redis://redis:6379/2}
      MINIO_ENDPOINT: http://minio:9000
    command:
      - celery
      - -A
      - faastlab_askai_indexing.celery_app:celery_app
      - worker
      # --beat embeds the scheduler in this worker process (fine for a single
      # worker). It fires the periodic "run-due-indexers" tick so folder data
      # sources auto-index on their schedule. For multi-worker prod, split beat
      # into its own service instead.
      - --beat
      - --loglevel=info
      - --concurrency=2
    restart: unless-stopped

  watcher:
    # Regulator change watcher — opt-in via the `watcher` profile so it
    # only spins up where it's wanted (e.g. the public live demo VM, not
    # every dev machine). Combines beat + worker into one process since
    # the task volume is trivial (hourly poll across 5 feeds).
    image: faastlab/askai:local
    container_name: askai-watcher
    profiles: ["watcher"]
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL_INTERNAL:-postgresql+asyncpg://askai:askai@postgres:5432/askai}
      REDIS_URL: ${REDIS_URL_INTERNAL:-redis://redis:6379/0}
      CELERY_BROKER_URL: ${CELERY_BROKER_INTERNAL:-redis://redis:6379/1}
      CELERY_RESULT_BACKEND: ${CELERY_RESULT_INTERNAL:-redis://redis:6379/2}
      WATCHER_ENABLED: "true"
    command:
      - celery
      - -A
      - faastlab_askai_watcher.celery_app:celery_app
      - worker
      - --beat
      - --loglevel=info
      - --concurrency=1
    restart: unless-stopped

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    image: faastlab/askai-web:local
    container_name: askai-web
    profiles: ["app"]
    depends_on:
      api:
        condition: service_started
    # ports:  # closed — internal only, NPM proxies us
    #   - "${WEB_PORT:-3000}:80"
    networks:
      - default
      - proxy
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  minio-data:

networks:
  default:
    driver: bridge
  proxy:
    external: true
    name: ${PROXY_NETWORK:-nathanpillai-network}
