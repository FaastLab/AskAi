apiVersion: v1
kind: ConfigMap
metadata:
  name: askai-env
data:
  APP_ENV: {{ .Values.env.APP_ENV | quote }}
  RERANKER_PROVIDER: {{ .Values.env.RERANKER_PROVIDER | quote }}
  EMBEDDINGS_PROVIDER: {{ .Values.env.EMBEDDINGS_PROVIDER | quote }}
  LLM_PROVIDER: {{ .Values.env.LLM_PROVIDER | quote }}
  DATABASE_URL: {{ .Values.postgres.externalUrl | default "postgresql+asyncpg://askai:askai@askai-postgres:5432/askai" | quote }}
  REDIS_URL: {{ .Values.redis.externalUrl | default "redis://askai-redis:6379/0" | quote }}
  MINIO_ENDPOINT: {{ .Values.minio.endpoint | default "http://askai-minio:9000" | quote }}
  MINIO_BUCKET: {{ .Values.minio.bucket | quote }}
  CELERY_BROKER_URL: {{ .Values.redis.externalUrl | default "redis://askai-redis:6379/1" | quote }}
  CELERY_RESULT_BACKEND: {{ .Values.redis.externalUrl | default "redis://askai-redis:6379/2" | quote }}
  {{- if .Values.observability.langfuse.enabled }}
  OBSERVABILITY_PROVIDER: "langfuse"
  LANGFUSE_HOST: {{ .Values.observability.langfuse.host | quote }}
  {{- else }}
  OBSERVABILITY_PROVIDER: "none"
  {{- end }}
---
apiVersion: v1
kind: Secret
metadata:
  name: askai-secrets
type: Opaque
stringData:
  OPENAI_API_KEY: {{ .Values.secrets.openaiApiKey | quote }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- if .Values.observability.langfuse.enabled }}
  LANGFUSE_PUBLIC_KEY: {{ .Values.observability.langfuse.publicKey | quote }}
  LANGFUSE_SECRET_KEY: {{ .Values.observability.langfuse.secretKey | quote }}
  {{- end }}
