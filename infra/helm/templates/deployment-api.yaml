apiVersion: apps/v1
kind: Deployment
metadata:
  name: askai-api
  labels:
    app: askai
    component: api
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels:
      app: askai
      component: api
  template:
    metadata:
      labels:
        app: askai
        component: api
    spec:
      containers:
        - name: api
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["uvicorn"]
          args:
            - "faastlab_askai_api.main:app"
            - "--host=0.0.0.0"
            - "--port={{ .Values.api.port }}"
          ports:
            - containerPort: {{ .Values.api.port }}
          envFrom:
            - configMapRef:
                name: askai-env
            - secretRef:
                name: askai-secrets
          readinessProbe:
            httpGet:
              path: /readyz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: {{ .Values.api.port }}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
{{ toYaml .Values.api.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: askai-api
spec:
  selector:
    app: askai
    component: api
  ports:
    - port: 80
      targetPort: {{ .Values.api.port }}
