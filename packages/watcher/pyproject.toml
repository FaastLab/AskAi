[project]
name = "faastlab-askai-watcher"
version = "0.1.0"
description = "Regulator change monitor — polls FCA / BoE / PRA / FOS / TPR feeds, dedupes, persists, notifies."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"

dependencies = [
  "faastlab-askai-core",
  # RSS / Atom parsing — handles the messy real-world feeds the regulators publish.
  "feedparser>=6.0",
  # Async HTTP for webhooks and feed fetches (regulators have flaky servers; we need timeouts + retries).
  "httpx>=0.27",
  "tenacity>=9.0",
  # Lightweight HTML parsing for the regulators that lack a clean RSS endpoint.
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_watcher"]
