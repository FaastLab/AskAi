[project]
name = "faastlab-askai-mcp"
version = "0.1.0"
description = "MCP server exposing AskAi tools to agents (Phase 7)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"

dependencies = [
  "faastlab-askai-core",
  "faastlab-askai-search",
  "faastlab-askai-askai",
  "faastlab-askai-summarisation",
  "faastlab-askai-indexing",
  "mcp>=1.9",                # official Anthropic Python MCP SDK (streamable_http_manager since 1.5)
  "starlette>=0.41",         # used by the HTTP transport wrapper
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_mcp"]
