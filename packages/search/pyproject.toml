[project]
name = "faastlab-askai-search"
version = "0.1.0"
description = "Hybrid retrieval + reranker for AskAi (Phase 3)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"

dependencies = [
  "faastlab-askai-core",
  "faastlab-askai-indexing",      # for the embeddings adapter at query time
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "pgvector>=0.3",
  "tenacity>=9.0",
  # Reranker stack. bge-reranker (BAAI, MIT) is the default OSS path —
  # 100% open source, runs locally. sentence-transformers brings torch
  # (~1GB on first install). Cohere is an optional managed alternative
  # (small SDK). 'none' (pass-through) needs neither and ships free.
  "sentence-transformers>=3.3",
  "torch>=2.5",
  "cohere>=5.11",
  # TEI reranker (provider='tei') calls the GPU box over HTTP — no torch needed.
  "httpx>=0.27",
]

[project.optional-dependencies]
# Kept for users who want to opt out of torch via --no-default-extras
# style installs; the default is to include the OSS reranker.
bge-reranker = [
  "sentence-transformers>=3.3",
  "torch>=2.5",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_search"]
