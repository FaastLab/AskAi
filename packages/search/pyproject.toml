[project]
name = "faastlab-askai-search"
version = "0.1.0"
description = "Hybrid retrieval: vector + keyword + RRF + reranker. Phase 3."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = ["faastlab-askai-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_search"]
