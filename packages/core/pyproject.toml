[project]
name = "faastlab-askai-core"
version = "0.1.0"
description = "Shared models, adapters, schemas, and config for AskAi"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"

dependencies = [
  "pydantic>=2.9",
  "pydantic-settings>=2.6",
  "sqlalchemy>=2.0",
  "asyncpg>=0.30",
  "alembic>=1.14",
  "pgvector>=0.3",
  "structlog>=24.4",
  # Typesense client lives in core so BOTH the search retriever and the indexing
  # pipeline (dual-write) can use it without a circular dep. Tiny, pure-Python;
  # unused on pgvector-only deployments.
  "typesense>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_core"]
