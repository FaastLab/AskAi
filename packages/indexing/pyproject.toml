[project]
name = "faastlab-askai-indexing"
version = "0.1.0"
description = "Indexing pipeline: connectors, parsers, chunkers, embedders, pipeline."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"

dependencies = [
  "faastlab-askai-core",
  # Embeddings + LLM clients
  "openai>=1.54",
  "tiktoken>=0.8",
  "tenacity>=9.0",
  # Storage (S3/MinIO/Azure Blob — boto3 covers MinIO since it's S3-API)
  "aioboto3>=13.2",
  "botocore>=1.35",
  # Parsers
  "pymupdf>=1.24",                 # default PDF parser
  "unstructured[pdf,docx,html,md]>=0.16",  # fallback for messy PDFs + DOCX/HTML/MD
  "python-docx>=1.1",
  "beautifulsoup4>=4.12",
  "lxml>=5.3",
  "markdown>=3.7",
  # Chunkers
  "langchain-text-splitters>=0.3",
  # Pipeline / async
  "httpx>=0.27",
  "celery[redis]>=5.4",
  # SQLAlchemy is provided transitively via core, but we use it directly here
  "sqlalchemy>=2.0",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "pytest-mock>=3.14",
  "respx>=0.21",   # mock httpx (OpenAI calls)
  "moto[s3]>=5.0", # mock S3/MinIO
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_indexing"]
