[project]
name = "faastlab-askai-indexing"
version = "0.1.0"
description = "Indexing pipeline: connectors, parsers, chunkers, embedders. Phase 2."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.12,<3.13"
dependencies = ["faastlab-askai-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_indexing"]
