[project]
name = "faastlab-askai"
version = "0.1.0"
description = "Python SDK for FaastLab AskAi (sync + async, streaming)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.10"  # SDK should work on older Pythons than the server
authors = [{ name = "FaastLab.Ai" }]

dependencies = [
  "httpx>=0.27",
  "httpx-sse>=0.4",
  "pydantic>=2.9",
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "respx>=0.21",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_sdk"]
