[project]
name = "faastlab-askai-sdk"
version = "0.1.0"
description = "Python SDK for AskAi (publishes as faastlab-askai). Phase 8."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"
dependencies = ["faastlab-askai-core"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_sdk"]
