[project]
name = "faastlab-askai-api"
version = "0.1.0"
description = "FastAPI REST + SSE surface for AskAi (Phase 6)."
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12,<3.13"

dependencies = [
  "faastlab-askai-core",
  "faastlab-askai-search",
  "faastlab-askai-askai",
  "faastlab-askai-summarisation",
  "faastlab-askai-indexing",
  "fastapi>=0.115",
  "uvicorn[standard]>=0.32",
  "pyjwt>=2.10",
  "sse-starlette>=2.1",
  "python-multipart>=0.0.18",     # for file uploads in /v1/ingest
  "slowapi>=0.1.9",               # rate limiting
  "bcrypt>=4.2",                  # password hashing for /v1/auth signup+login
  "email-validator>=2.2",         # used by Pydantic EmailStr
]

[dependency-groups]
dev = [
  "pytest>=8.3",
  "pytest-asyncio>=0.24",
  "httpx>=0.27",
  "asgi-lifespan>=2.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/faastlab_askai_api"]
